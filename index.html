    <meta charset="UTF-8">

    <title>Join Official Telegram Channel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* Reset & Full Screen Premium Cyber Background */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a153a 0%, #0a0817 100%);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Animated Glowing Background Element */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: #00ff88;
            opacity: 0.05;
            filter: blur(120px);
            top: 20%;
            z-index: -1;
        }

        /* Main Container - No Small Box Look */
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo with Ultra Gold & Neon Glow */
        .profile-pic {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4), 0 0 15px rgba(0, 255, 136, 0.3);
        }

        /* Main Headline - High-Quality Focus */
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.2;
            background: linear-gradient(to right, #ffffff, #b3b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        /* Clear Telegram Target Subtitle */
        .subtitle {
            color: #00ff88; /* Neon Green for instant eyes-on */
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        /* Bouncing Arrow Indicators */
        .arrows {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 20px;
            animation: bounce 1.8s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-12px); }
            60% { transform: translateY(-6px); }
        }

        /* Premium Tabahi Join Button */
        .btn {
            background: linear-gradient(45deg, #00ff88, #0072ff);
            color: #ffffff;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            width: 95%;
            max-width: 380px;
            letter-spacing: 1px;
            box-shadow: 0 12px 25px rgba(0, 255, 136, 0.3);
            animation: pulse-btn 1.4s infinite;
            text-transform: uppercase;
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 0 18px rgba(0, 255, 136, 0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); transform: scale(1); }
        }

        /* 5-Second Timer Layout */
        .timer-section {
            margin-top: 45px;
            font-size: 1rem;
            color: #8e8e9f;
            font-weight: 600;
        }
        #seconds {
            color: #00ff88;
            font-weight: 900;
            font-size: 1.2rem;
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            margin: 0 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="IMG_20260519_221534_479.jpg" alt="YAARWIN VIP" class="profile-pic">

        <h1>YAARWIN VIP</h1>
        <div class="subtitle">OFFICIAL TELEGRAM CHANNEL</div>

        <div class="arrows">👇 👇 👇</div>

        <a href="https://t.me/yaarwinhackapp" class="btn" onclick="trackLeadEvent()">JOIN CHANNEL NOW</a>

        <div class="timer-section">
            Connecting securely in <span id="seconds">05</span> seconds...
        </div>
    </div>

    <script>
        let timeLeft = 5; 
        const tgLink = "https://t.me/yaarwinhackapp";
        const secondsElement = document.getElementById('seconds');

        // Meta Lead Tracking Function
        function trackLeadEvent() {
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Lead');
            }
        }

        // Auto Redirect Logic
        const timer = setInterval(() => {
            timeLeft--;
            secondsElement.innerText = '0' + timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                trackLeadEvent(); // Redirect hone se thik pehle event track hoga
                setTimeout(() => {
                    window.location.href = tgLink; 
                }, 100);
            }
        }, 1000); 
    </script>
</body>
</html>
