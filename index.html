<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAICLUB VIP - Ultimate Recovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* Reset & Body (Dark Premium VIP Theme) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); /* Dark VIP background */
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Image setup with Gold Glow */
        .profile-pic {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #ffd700; /* Gold border */
            object-fit: cover;
            margin-top: 30px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); /* Gold glow background */
        }

        /* Typography - Glowing Text */
        h1 {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3rem;
            margin: 20px 0 5px 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #e0e0e0;
            font-size: 1.15rem;
            font-weight: 600;
            margin: 5px 0;
        }
        .highlight { 
            color: #ffd700; /* Gold text */
            font-weight: 800; 
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        } 

        /* Click here text - Bouncing Animation */
        .click-here {
            color: #00ff88; /* Neon green */
            font-size: 1.3rem;
            font-weight: 800;
            margin-top: 35px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Button with Slow Pulse Animation */
        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b); /* Bright red/pink gradient */
            color: white;
            padding: 18px 30px;
            font-size: 1.5rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
            animation: pulse-btn 1.5s infinite; /* Slow pop animation */
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0.7); transform: scale(1); }
            50% { box-shadow: 0 0 0 20px rgba(255, 65, 108, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0); transform: scale(1); }
        }

        /* Timer Styling - Glassmorphism Boxes */
        .timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 75px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .time-box .num {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffd700;
            display: block;
        }
        .time-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <img src="IMG_20260507_120221_874.jpg" alt="JAICLUB VIP" class="profile-pic">

    <h1>JAICLUB VIP</h1>
    <div class="subtitle">Recover all your <span class="highlight">Losses</span></div>
    <div class="subtitle">Get <span class="highlight">95% accurate</span> Shots 🔥</div>

    <div class="click-here">👇 Click Here to join 👇</div>

    <a href="https://t.me/+2LSDqxfhPpRlMTM1" class="btn">JOIN VIP TELEGRAM</a>

    <div class="timer-container">
        <div class="time-box"><span class="num">00</span><span class="label">Days</span></div>
        <div class="time-box"><span class="num">00</span><span class="label">Hours</span></div>
        <div class="time-box"><span class="num">00</span><span class="label">Mins</span></div>
        <div class="time-box"><span class="num" id="seconds">05</span><span class="label">Secs</span></div>
    </div>

    <script>
        let timeLeft = 5; 
        const tgLink = "https://t.me/+2LSDqxfhPpRlMTM1";
        const secondsElement = document.getElementById('seconds');

        const timer = setInterval(() => {
            timeLeft--;
            secondsElement.innerText = '0' + timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = tgLink; 
            }
        }, 1000); 
    </script>
</body>
</html>
